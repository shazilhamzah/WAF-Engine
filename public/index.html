<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>WAF Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header" id="app-header" hidden>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span class="brand-name">WAF Studio</span>
      <span id="mode-badge" class="mode-slot" aria-live="polite"></span>
    </div>
    <button type="button" id="nav-toggle" class="btn nav-toggle" aria-expanded="false" aria-controls="app-nav">☰ Menu</button>
    <div class="user-box" id="user-box"></div>
  </header>
  <div class="layout" id="layout">
    <nav class="app-nav" id="app-nav" aria-label="Main" hidden></nav>
    <main id="main" class="main" tabindex="-1">
      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="view" class="view">
        <noscript><p class="panel">WAF Studio needs JavaScript enabled.</p></noscript>
        <p class="loading">Loading WAF Studio…</p>
      </div>
    </main>
  </div>
  <footer class="app-footer">
    <p>WAF Studio — learning, explainable reverse-proxy WAF · local lab use only</p>
  </footer>
</body>
</html>
